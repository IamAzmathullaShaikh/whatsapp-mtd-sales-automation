name: Build release packages

# Builds both ready-to-run packages on every tag push (v*) and on manual runs:
#   Windows: WhatsAppMTD.exe        — double-click, no Python needed
#   Linux:   WhatsAppMTD-<arch>.AppImage — chmod +x, double-click
# Both are uploaded as artifacts and attached to the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The repo's default GITHUB_TOKEN permission is read-only, so we must
# explicitly grant write access here or the release/upload step fails.
permissions:
  contents: write

jobs:
  windows:
    name: WhatsAppMTD.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build the .exe
        run: python -m PyInstaller --noconfirm WhatsAppMTD.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppMTD-Windows
          path: dist/WhatsAppMTD.exe
      - name: Attach to GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WhatsAppMTD.exe

  linux:
    name: WhatsAppMTD.AppImage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build the AppImage
        env:
          PYBIN: python3
        run: bash packaging/build_appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppMTD-Linux
          path: dist/WhatsAppMTD-*.AppImage
      - name: Attach to GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WhatsAppMTD-*.AppImage
